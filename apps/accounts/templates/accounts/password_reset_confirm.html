{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Set new password — Maira Bijouterie{% endblock %}

{% block main_classes %}container my-5{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <h1 class="h3 mb-4 text-center">Set a new password</h1>
                <form method="post" novalidate>
                    {% csrf_token %}
                    {{ form|crispy }}
                    <button type="submit" class="btn btn-dark w-100 mt-2">Set password</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
